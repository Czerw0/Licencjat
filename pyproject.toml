[project]
name = "reddit-analysis"
version = "0.1.0"
description = "Cykliczność emocji i polaryzacja w komentarzach z politycznych subredditów (praca licencjacka)"
readme = "README.md"
authors = [
    { name = "karol", email = "karol.czerwo@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "ipykernel>=7.4.0",
    "lingua-language-detector>=2.0.0",
    "matplotlib>=3.11.2",
    "nbclient>=0.11.0",
    "nbconvert>=7.17.2",
    "nbformat>=5.11.1",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "torch>=2.11.0",
    "tqdm>=4.70.1",
    "transformers>=5.20.2",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
